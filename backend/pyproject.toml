[project]
name = "dwg3d"
version = "0.1.0"
description = "DWG/DXF floor plans -> 3D glTF building model"
requires-python = ">=3.12"
dependencies = [
  "ezdxf>=1.3",
  "shapely>=2.0",
  "trimesh>=4.0",
  "mapbox-earcut>=1.0",
  "numpy",
  "pyyaml",
  "fastapi>=0.110",
  "uvicorn[standard]",
  "python-multipart",
  "matplotlib",
  "scipy>=1.18.1",
  "ifcopenshell>=0.8.5",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "openpyxl>=3.1",
  "boto3>=1.43.105",
  "pyjwt[crypto]>=2.15.1",
  "httpx>=0.28.1",
  "mcp>=1.20",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
