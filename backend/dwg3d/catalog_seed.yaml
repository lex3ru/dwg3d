# Catalog of furniture and equipment (seed for the catalog_* tables).
#
# Loaded into PostgreSQL on first start (empty catalog) and by
#   uv run python -m dwg3d catalog load [file]
# which updates items by id; items missing from the file are marked inactive
# (still shown where already placed, hidden from the picker) — never delete ids.
#
# Sizes in meters: w — width (local X), d — depth (local Z, the front faces +Z,
# away from the wall), h — height. clear — service zone in front of the item,
# wall — normally placed back to a wall, elev — mounting height of the bottom.
# kind — procedural model used when there is no GLB model (or while it loads);
# model — GLB under frontend/public/catalog/, scaled to w×d×h, model_rot turns it
# (deg) so its front faces +Z. cam — CCTV: fov (deg, 360 = panoramic), range and
# face identification distance (m). Optional: article, supplier, price, currency.
#
# GLB models under kenney/ — Kenney Furniture Kit 2.0, CC0 (www.kenney.nl).

