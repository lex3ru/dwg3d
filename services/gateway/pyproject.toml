[project]
name = "twin-gateway"
version = "0.1.0"
description = "Digital twin: the gateway: sign-in sessions, passing requests on to services, events to the browser"
requires-python = ">=3.12"
dependencies = ["twin-chassis", "httpx>=0.28"]

[dependency-groups]
dev = ["twin-chassis[testing]", "ruff>=0.8"]

[tool.uv]
package = false

[tool.uv.sources]
twin-chassis = { path = "../../libs/chassis", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]      # Depends() in argument defaults is how FastAPI works

[tool.ruff.lint.isort]
known-first-party = ["app"]
