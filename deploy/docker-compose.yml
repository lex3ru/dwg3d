# Digital twin: the whole stack in containers.
#
#   deploy/make-env.sh https://<site>     # deploy/.env with random passwords
#                                         # (on this machine: cp deploy/.env.example deploy/.env)
#   docker compose -f deploy/docker-compose.yml up -d --build
#   open http://localhost:${TWIN_HTTP_PORT:-8090}
#
# Development of one service without its container:
#   docker compose -f deploy/docker-compose.yml up -d db db-init nats keycloak
#   cd services/<name> && uv run uvicorn app.main:build --factory --reload
#
#   web       Caddy: the built UI and the single entry point
#             (/api, /auth, /q, /s -> gateway; /kc -> keycloak)
#   gateway   sign-in sessions, passes requests on to the services, events to the browser
#   <name>    the services (services/<name>), each with its own database
#   db        PostgreSQL: one server, a database and a role per service
#   db-init   creates the databases and roles listed in TWIN_DATABASES (every start; idempotent)
#   nats      the event bus (JetStream)
#   keycloak  sign-in, realm "twin" imported from deploy/keycloak/
#   kc-init   creates the services' own accounts in Keycloak (every start; idempotent)
#   s3        S3-compatible storage for files (RustFS)
name: twin

x-service: &service
  restart: unless-stopped
  depends_on:
    db-init:
      condition: service_completed_successfully
    nats:
      condition: service_started
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s

x-s3-env: &s3-env
  TWIN_S3_ENDPOINT: http://s3:9000
  TWIN_S3_ACCESS_KEY: ${TWIN_S3_ACCESS_KEY:-twin}
  TWIN_S3_SECRET_KEY: ${TWIN_S3_SECRET_KEY:-twin-secret}

x-service-env: &service-env
  TWIN_NATS_URL: nats://nats:4222
  TWIN_GUEST_JWKS: http://access:8000/api/access/v1/.well-known/jwks.json
  TWIN_PUBLIC_URL: ${TWIN_PUBLIC_URL:-http://localhost:8090}
  TWIN_OIDC_ISSUER: ${TWIN_PUBLIC_URL:-http://localhost:8090}/kc/realms/twin
  TWIN_OIDC_INTERNAL: http://keycloak:8080/kc/realms/twin
  TWIN_OIDC_CLIENT_ID: twin
  # connections to the database kept open, as many again when busy (deploy/README.md)
  TWIN_DB_POOL: ${TWIN_DB_POOL:-5}

services:
  web:
    build: ../frontend
    image: twin-web:${TWIN_TAG:-dev}
    restart: unless-stopped
    environment:
      TWIN_SITE: ${TWIN_SITE:-:80}
    ports:
      - "${TWIN_HTTP_PORT:-8090}:80"
      - "${TWIN_HTTPS_PORT:-8453}:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - gateway

  gateway:
    <<: *service
    build: {context: .., dockerfile: deploy/service.Dockerfile, args: {SERVICE: gateway}}
    image: twin-gateway:${TWIN_TAG:-dev}
    environment:
      <<: *service-env
      TWIN_DATABASE_URL: postgresql+psycopg://gateway:${TWIN_DB_PASSWORD_GATEWAY:-gateway}@db:5432/gateway
      TWIN_PUBLIC_URL: ${TWIN_PUBLIC_URL:-http://localhost:8090}
      TWIN_OIDC_CLIENT_SECRET: ${TWIN_OIDC_CLIENT_SECRET:-dev-client-secret}
      TWIN_SECRET: ${TWIN_SECRET:-dev-secret-change-me}
      # the services requests are passed on to: name=address, comma-separated
      TWIN_SERVICES: ${TWIN_SERVICES:-ping=http://ping:8000,import=http://import:8000,buildings=http://buildings:8000,access=http://access:8000,people=http://people:8000,catalog=http://catalog:8000,assets=http://assets:8000,journal=http://journal:8000,planning=http://planning:8000,copilot=http://copilot:8000}

  ping:
    <<: *service
    build: {context: .., dockerfile: deploy/service.Dockerfile, args: {SERVICE: ping}}
    image: twin-ping:${TWIN_TAG:-dev}
    environment:
      <<: *service-env
      TWIN_DATABASE_URL: postgresql+psycopg://ping:${TWIN_DB_PASSWORD_PING:-ping}@db:5432/ping

  import:
    <<: *service
    build: {context: .., dockerfile: services/import/Dockerfile}
    image: twin-import:${TWIN_TAG:-dev}
    environment: &import-env
      <<: [*service-env, *s3-env]
      TWIN_DATABASE_URL: postgresql+psycopg://import:${TWIN_DB_PASSWORD_IMPORT:-import}@db:5432/import
      TWIN_DATA: /data
      TWIN_SERVICES: access=http://access:8000,buildings=http://buildings:8000
      TWIN_MAX_UPLOAD_MB: ${TWIN_MAX_UPLOAD_MB:-200}
      # ODA File Converter (optional, better DWG support): path inside the container of a binary mounted into it
      DWG3D_ODA: ${TWIN_ODA:-}
    volumes:
      - import-data:/data

  # the build queue: DWG -> floors, rooms, 3D model (scale with --scale import-worker=N)
  import-worker:
    <<: *service
    image: twin-import:${TWIN_TAG:-dev}
    command: ["python", "-m", "app.worker"]
    environment: *import-env
    volumes:
      - import-data:/data
    healthcheck: {disable: true}
    depends_on:
      import:
        condition: service_healthy

  buildings:
    <<: *service
    build: {context: .., dockerfile: deploy/service.Dockerfile, args: {SERVICE: buildings}}
    image: twin-buildings:${TWIN_TAG:-dev}
    environment:
      <<: [*service-env, *s3-env]
      TWIN_DATABASE_URL: postgresql+psycopg://buildings:${TWIN_DB_PASSWORD_BUILDINGS:-buildings}@db:5432/buildings
      # its own account (Keycloak client twin-svc-buildings) and whom it calls
      TWIN_SERVICE_SECRET: ${TWIN_SVC_SECRET_BUILDINGS:-dev-svc-buildings}
      TWIN_SERVICES: import=http://import:8000,access=http://access:8000,assets=http://assets:8000

  access:
    <<: *service
    build: {context: .., dockerfile: deploy/service.Dockerfile, args: {SERVICE: access}}
    image: twin-access:${TWIN_TAG:-dev}
    environment:
      <<: *service-env
      TWIN_DATABASE_URL: postgresql+psycopg://access:${TWIN_DB_PASSWORD_ACCESS:-access}@db:5432/access
      # its own account (Keycloak client twin-svc-access): the automatic grants are checked against people and assets
      TWIN_SERVICE_SECRET: ${TWIN_SVC_SECRET_ACCESS:-dev-svc-access}
      TWIN_SERVICES: people=http://people:8000,assets=http://assets:8000

  people:
    <<: *service
    build: {context: .., dockerfile: deploy/service.Dockerfile, args: {SERVICE: people}}
    image: twin-people:${TWIN_TAG:-dev}
    environment:
      <<: *service-env
      TWIN_DATABASE_URL: postgresql+psycopg://people:${TWIN_DB_PASSWORD_PEOPLE:-people}@db:5432/people
      TWIN_SERVICES: access=http://access:8000,buildings=http://buildings:8000,assets=http://assets:8000

  catalog:
    <<: *service
    build: {context: .., dockerfile: deploy/service.Dockerfile, args: {SERVICE: catalog}}
    image: twin-catalog:${TWIN_TAG:-dev}
    environment:
      <<: [*service-env, *s3-env]
      TWIN_DATABASE_URL: postgresql+psycopg://catalog:${TWIN_DB_PASSWORD_CATALOG:-catalog}@db:5432/catalog
      TWIN_SERVICES: assets=http://assets:8000

  assets:
    <<: *service
    build: {context: .., dockerfile: deploy/service.Dockerfile, args: {SERVICE: assets}}
    image: twin-assets:${TWIN_TAG:-dev}
    environment:
      <<: [*service-env, *s3-env]
      TWIN_DATABASE_URL: postgresql+psycopg://assets:${TWIN_DB_PASSWORD_ASSETS:-assets}@db:5432/assets
      TWIN_SERVICE_SECRET: ${TWIN_SVC_SECRET_ASSETS:-dev-svc-assets}
      TWIN_SERVICES: buildings=http://buildings:8000,catalog=http://catalog:8000,access=http://access:8000

  journal:
    <<: *service
    build: {context: .., dockerfile: deploy/service.Dockerfile, args: {SERVICE: journal}}
    image: twin-journal:${TWIN_TAG:-dev}
    environment:
      <<: *service-env
      TWIN_DATABASE_URL: postgresql+psycopg://journal:${TWIN_DB_PASSWORD_JOURNAL:-journal}@db:5432/journal
      TWIN_SERVICES: access=http://access:8000
      # how long the journal keeps events, days (5 years)
      TWIN_JOURNAL_KEEP_DAYS: ${TWIN_JOURNAL_KEEP_DAYS:-1825}

  planning:
    <<: *service
    build: {context: .., dockerfile: deploy/service.Dockerfile, args: {SERVICE: planning}}
    image: twin-planning:${TWIN_TAG:-dev}
    environment:
      <<: *service-env
      TWIN_DATABASE_URL: postgresql+psycopg://planning:${TWIN_DB_PASSWORD_PLANNING:-planning}@db:5432/planning
      # objects and the catalog are asked with the user's own token; nothing on its own behalf
      TWIN_SERVICES: access=http://access:8000,assets=http://assets:8000,catalog=http://catalog:8000

  copilot:
    <<: *service
    build: {context: .., dockerfile: deploy/service.Dockerfile, args: {SERVICE: copilot}}
    image: twin-copilot:${TWIN_TAG:-dev}
    environment:
      <<: *service-env
      TWIN_DATABASE_URL: postgresql+psycopg://copilot:${TWIN_DB_PASSWORD_COPILOT:-copilot}@db:5432/copilot
      # everything is asked with the user's own token; nothing on its own behalf
      TWIN_SERVICES: access=http://access:8000,buildings=http://buildings:8000,import=http://import:8000,catalog=http://catalog:8000,assets=http://assets:8000,people=http://people:8000,journal=http://journal:8000,planning=http://planning:8000
      # encrypts the model's API key at rest (docs/COPILOT.md)
      TWIN_COPILOT_SECRET: ${TWIN_COPILOT_SECRET:-dev-copilot-secret}
    # a model served on this machine (Ollama, vLLM) is reachable as http://host.docker.internal:<port>/v1
    extra_hosts: ["host.docker.internal:host-gateway"]

  # -- new services go above this line (tools/new-service adds them) --

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # the services and Keycloak share it: 11 processes x 10 + Keycloak 25 (deploy/README.md)
    command: ["postgres", "-c", "max_connections=${TWIN_DB_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twin}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${TWIN_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  db-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: db
      PGUSER: twin
      PGPASSWORD: ${POSTGRES_PASSWORD:-twin}
      PGDATABASE: postgres
      # a database and a role of the same name for each; the password of <name> is TWIN_DB_PASSWORD_<NAME>
      TWIN_DATABASES: ${TWIN_DATABASES:-keycloak gateway ping import buildings access people catalog assets journal planning copilot}
      TWIN_DB_PASSWORD_KEYCLOAK: ${TWIN_DB_PASSWORD_KEYCLOAK:-keycloak}
      TWIN_DB_PASSWORD_GATEWAY: ${TWIN_DB_PASSWORD_GATEWAY:-gateway}
      TWIN_DB_PASSWORD_PING: ${TWIN_DB_PASSWORD_PING:-ping}
      TWIN_DB_PASSWORD_IMPORT: ${TWIN_DB_PASSWORD_IMPORT:-import}
      TWIN_DB_PASSWORD_BUILDINGS: ${TWIN_DB_PASSWORD_BUILDINGS:-buildings}
      TWIN_DB_PASSWORD_ACCESS: ${TWIN_DB_PASSWORD_ACCESS:-access}
      TWIN_DB_PASSWORD_PEOPLE: ${TWIN_DB_PASSWORD_PEOPLE:-people}
      TWIN_DB_PASSWORD_CATALOG: ${TWIN_DB_PASSWORD_CATALOG:-catalog}
      TWIN_DB_PASSWORD_ASSETS: ${TWIN_DB_PASSWORD_ASSETS:-assets}
      TWIN_DB_PASSWORD_JOURNAL: ${TWIN_DB_PASSWORD_JOURNAL:-journal}
      TWIN_DB_PASSWORD_PLANNING: ${TWIN_DB_PASSWORD_PLANNING:-planning}
      TWIN_DB_PASSWORD_COPILOT: ${TWIN_DB_PASSWORD_COPILOT:-copilot}
      # -- passwords of new databases go above this line --
    volumes:
      - ./postgres/ensure-databases.sh:/ensure-databases.sh:ro
    command: ["sh", "/ensure-databases.sh"]
    depends_on:
      db:
        condition: service_healthy

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:${TWIN_NATS_PORT:-4223}:4222"
    volumes:
      - natsdata:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${TWIN_DB_PASSWORD_KEYCLOAK:-keycloak}
      KC_DB_POOL_INITIAL_SIZE: "5"
      KC_DB_POOL_MIN_SIZE: "5"
      KC_DB_POOL_MAX_SIZE: "25"
      KC_HOSTNAME: ${TWIN_PUBLIC_URL:-http://localhost:8090}/kc
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /kc
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-kcadmin}
      # read by the realm import (deploy/keycloak/twin-realm.json)
      TWIN_PUBLIC_URL: ${TWIN_PUBLIC_URL:-http://localhost:8090}
      TWIN_DEV_URL: ${TWIN_DEV_URL:-http://localhost:5180}
      TWIN_OIDC_CLIENT_SECRET: ${TWIN_OIDC_CLIENT_SECRET:-dev-client-secret}
      TWIN_ADMIN_USER: ${TWIN_ADMIN_USER:-admin}
      TWIN_ADMIN_PASSWORD: ${TWIN_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${TWIN_KEYCLOAK_PORT:-8181}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully

  # accounts of services in Keycloak (clients twin-svc-<name>), for calls between services;
  # every start, idempotent — the realm file itself is imported only once
  kc-init:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: "no"
    entrypoint: ["/bin/sh", "/ensure-clients.sh"]
    environment:
      KC_URL: http://keycloak:8080/kc
      TWIN_PUBLIC_URL: ${TWIN_PUBLIC_URL:-http://localhost:8090}
      TWIN_DEV_URL: ${TWIN_DEV_URL:-http://localhost:5180}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-kcadmin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-kcadmin}
      # a client twin-svc-<name> for each; its secret is TWIN_SVC_SECRET_<NAME>
      TWIN_SERVICE_CLIENTS: ${TWIN_SERVICE_CLIENTS:-buildings assets access}
      TWIN_SVC_SECRET_BUILDINGS: ${TWIN_SVC_SECRET_BUILDINGS:-dev-svc-buildings}
      TWIN_SVC_SECRET_ASSETS: ${TWIN_SVC_SECRET_ASSETS:-dev-svc-assets}
      TWIN_SVC_SECRET_ACCESS: ${TWIN_SVC_SECRET_ACCESS:-dev-svc-access}
      # -- secrets of new service accounts go above this line --
    volumes:
      - ./keycloak/ensure-clients.sh:/ensure-clients.sh:ro
    depends_on:
      - keycloak

  s3:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${TWIN_S3_ACCESS_KEY:-twin}
      RUSTFS_SECRET_KEY: ${TWIN_S3_SECRET_KEY:-twin-secret}
    ports:
      - "127.0.0.1:${TWIN_S3_PORT:-9002}:9000"
    volumes:
      - s3data:/data

volumes:
  pgdata:
  import-data:
  natsdata:
  s3data:
  caddy-data:
