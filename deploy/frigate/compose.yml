name: planuchet-frigate
services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable@sha256:fd60f99ffd4eb6c42360ed4e14953e270586f239309ab3983e55b2e97ffac09a
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "256mb"
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      TZ: Europe/Moscow
    volumes:
      - ./config:/config
      - media:/media/frigate
    tmpfs:
      - /tmp/cache:size=256m
volumes:
  media:
