# Установка (9.3, 8.5): Caddy (HTTPS), приложение, фоновые задачи, PostgreSQL,
# резервное копирование. Настройки — в deploy/.env (его создаёт install.sh).

name: planuchet

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: planuchet-app:latest
  restart: unless-stopped
  environment:
    APP_DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD}@db:5432/app
    APP_BACKUP_DIR: /backups
    APP_WORKERS: ${APP_WORKERS:-4}
    # запросов одновременно на процесс приложения и соединений в его пуле (ADR-0020)
    APP_DB_POOL: ${APP_DB_POOL:-10}
    # постоянный адрес системы — по умолчанию на него ведут QR-метки (R-016)
    APP_PUBLIC_URL: ${PUBLIC_URL}
    # память процесса фоновой задачи сверх занятого обработчиком и dwg2dxf, МБ (ADR-0011)
    APP_TASK_MEMORY_MB: ${APP_TASK_MEMORY_MB:-4096}
    APP_DWG2DXF_MEMORY_MB: ${APP_DWG2DXF_MEMORY_MB:-4096}
    TZ: ${TZ:-Europe/Moscow}
  volumes:
    - files:/data
    - ${BACKUP_DIR:-./backups}:/backups:ro
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # процессам приложения по APP_DB_POOL + 3 соединения и 10 — прочим (docs/INSTALL.md,
    # «Производительность»): 100 по умолчанию не хватило бы уже восьми процессам
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "app"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    <<: *app
    command: ["python", "-m", "app", "serve"]

  worker:
    <<: *app
    command: ["python", "-m", "app", "worker"]
    # задача — в дочернем процессе (ADR-0011): init подбирает осиротевшие dwg2dxf
    init: true
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      CADDY_TLS: ${CADDY_TLS:-internal}
      PUBLIC_URL: ${PUBLIC_URL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      app:
        condition: service_healthy

  backup:
    build: ./backup
    image: planuchet-backup:latest
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: app
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: app
      BACKUP_AT: ${BACKUP_AT:-0 2 * * *}
      KEEP_DAILY: ${KEEP_DAILY:-30}
      KEEP_MONTHLY: ${KEEP_MONTHLY:-12}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - files:/data:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
  files:
  caddy:
