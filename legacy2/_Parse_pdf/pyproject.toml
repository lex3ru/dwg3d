[project]
name = "pdf2dxf"
version = "0.1.0"
description = "Конвертер векторных PDF-чертежей в DXF для CAD-систем"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "ezdxf>=1.3",
    "opencv-python-headless>=5.0.0.93",
    "scikit-image>=0.25.2",
    "numpy>=2.2.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
pdf2dxf = "pdf2dxf.cli:main"

[project.gui-scripts]
pdf2dxf-gui = "pdf2dxf.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdf2dxf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
