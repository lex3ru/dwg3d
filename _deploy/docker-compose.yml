# «Поэтажные планы → 3D» (dwg3d): production stack.
# Instructions: README.md in this folder.
#
#   cp .env.example .env && nano .env      # domain, passwords
#   docker compose build                   # or: scripts/load-images.sh images/
#   docker compose up -d
#
# Only `web` is reachable from outside (80/443). Everything else talks on the
# internal network; the data lives in named volumes and ./backups.
name: dwg3d

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-app: &app
  build: ./src/backend
  image: ${DWG3D_IMAGE_API:-dwg3d-api}:${DWG3D_TAG:-latest}
  restart: unless-stopped
  logging: *logging
  environment: &app-env
    DWG3D_DATABASE_URL: postgresql+psycopg://dwg3d:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}@db:5432/dwg3d
    DWG3D_DATA: /data
    DWG3D_AUTH: oidc
    DWG3D_PUBLIC_URL: ${DWG3D_PUBLIC_URL:?DWG3D_PUBLIC_URL is not set}
    DWG3D_OIDC_ISSUER: ${DWG3D_PUBLIC_URL}/auth/realms/dwg3d
    DWG3D_OIDC_INTERNAL: http://keycloak:8080/auth/realms/dwg3d
    DWG3D_OIDC_CLIENT_SECRET: ${DWG3D_OIDC_CLIENT_SECRET:?DWG3D_OIDC_CLIENT_SECRET is not set}
    DWG3D_SECRET: ${DWG3D_SECRET:?DWG3D_SECRET is not set}
    DWG3D_S3_ENDPOINT: http://s3:9000
    DWG3D_S3_BUCKET: dwg3d
    DWG3D_S3_ACCESS_KEY: ${DWG3D_S3_ACCESS_KEY:?DWG3D_S3_ACCESS_KEY is not set}
    DWG3D_S3_SECRET_KEY: ${DWG3D_S3_SECRET_KEY:?DWG3D_S3_SECRET_KEY is not set}
    DWG3D_MAX_UPLOAD_MB: ${DWG3D_MAX_UPLOAD_MB:-200}
    DWG3D_ODA: ${DWG3D_ODA:-}
  volumes:
    - scratch:/data              # working copies and temporary files only
  depends_on:
    db: { condition: service_healthy }
    s3: { condition: service_started }

services:
  web:
    build: ./src/frontend
    image: ${DWG3D_IMAGE_WEB:-dwg3d-web}:${DWG3D_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment:
      DWG3D_SITE: ${DWG3D_SITE:?DWG3D_SITE is not set}
    ports:
      - "${DWG3D_HTTP_PORT:-80}:80"
      - "${DWG3D_HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data         # TLS certificates
      - caddy-config:/config
    depends_on: [api]

  api:
    <<: *app
    environment:
      <<: *app-env
      DWG3D_WORKERS: "0"         # builds run in the worker service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    <<: *app
    command: ["python", "-m", "dwg3d", "worker", "-n", "${DWG3D_WORKER_THREADS:-2}"]

  backup:
    <<: *app
    user: "0"                    # writes into a host directory
    volumes:
      - ${DWG3D_BACKUP_DIR:-./backups}:/backups
    command: ["sh", "-c", "while true; do python -m dwg3d backup /backups --keep ${DWG3D_BACKUP_KEEP:-14}; sleep ${DWG3D_BACKUP_INTERVAL:-86400}; done"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    logging: *logging
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/dwg3d
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: dwg3d
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${DWG3D_PUBLIC_URL}/auth
      KC_HTTP_ENABLED: "true"    # TLS ends at `web`
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is not set}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is not set}
      # read by the realm import (keycloak/dwg3d-realm.json), on the first start only
      DWG3D_PUBLIC_URL: ${DWG3D_PUBLIC_URL}
      DWG3D_OIDC_CLIENT_SECRET: ${DWG3D_OIDC_CLIENT_SECRET}
      DWG3D_ADMIN_USER: ${DWG3D_ADMIN_USER:-admin}
      DWG3D_ADMIN_PASSWORD: ${DWG3D_ADMIN_PASSWORD:?DWG3D_ADMIN_PASSWORD is not set}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      # its tables live in the "keycloak" schema, created by the API's migrations
      api: { condition: service_healthy }

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: dwg3d
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dwg3d
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwg3d -d dwg3d"]
      interval: 3s
      timeout: 3s
      retries: 30

  s3:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    logging: *logging
    environment:
      RUSTFS_ACCESS_KEY: ${DWG3D_S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${DWG3D_S3_SECRET_KEY}
    volumes:
      - s3data:/data

volumes:
  pgdata:
  s3data:
  scratch:
  caddy-data:
  caddy-config:
