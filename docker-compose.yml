# PostgreSQL for dwg3d. Start:  docker compose up -d db
# The API connects via DWG3D_DATABASE_URL (default matches this service).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dwg3d
      POSTGRES_PASSWORD: dwg3d
      POSTGRES_DB: dwg3d
    ports:
      - "127.0.0.1:${DWG3D_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwg3d -d dwg3d"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
