# dwg3d: the whole stack in containers.
#
#   cp .env.example .env        # passwords, site name
#   docker compose up -d --build
#   open http://localhost:${DWG3D_HTTP_PORT:-8088}
#
# Local development without containers for the app itself:
#   docker compose up -d db     # then `uv run uvicorn dwg3d.api:app` and `npm run dev`
#
# Services:
#   web     Caddy: the built UI and the single entry point (/api, /auth)
#   api     FastAPI (dwg3d.api)
#   worker  build queue: DWG -> 3D model (scale with --scale worker=N)
#   db      PostgreSQL
#   s3      RustFS: S3-compatible storage for drawings, models, exports
#   backup  once a day: database dump + mirror of the files (DWG3D_BACKUP_DIR)
name: 3drender

x-app: &app
  build: ./backend
  image: dwg3d-api:${DWG3D_TAG:-dev}
  restart: unless-stopped
  environment: &app-env
    DWG3D_DATABASE_URL: postgresql+psycopg://dwg3d:${POSTGRES_PASSWORD:-dwg3d}@db:5432/dwg3d
    DWG3D_DATA: /data
    DWG3D_AUTH: ${DWG3D_AUTH:-on}
    DWG3D_ODA: ${DWG3D_ODA:-}
    DWG3D_S3_ENDPOINT: http://s3:9000
    DWG3D_S3_BUCKET: ${DWG3D_S3_BUCKET:-dwg3d}
    DWG3D_S3_ACCESS_KEY: ${DWG3D_S3_ACCESS_KEY:-dwg3d}
    DWG3D_S3_SECRET_KEY: ${DWG3D_S3_SECRET_KEY:-dwg3d-secret}
  volumes:
    # working copies and temporary files only: the files themselves are in s3
    - scratch:/data
  depends_on:
    db:
      condition: service_healthy
    s3:
      condition: service_started

services:
  web:
    build: ./frontend
    image: dwg3d-web:${DWG3D_TAG:-dev}
    restart: unless-stopped
    environment:
      DWG3D_SITE: ${DWG3D_SITE:-:80}
    ports:
      - "${DWG3D_HTTP_PORT:-8088}:80"
      - "${DWG3D_HTTPS_PORT:-8443}:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - api

  api:
    <<: *app
    environment:
      <<: *app-env
      DWG3D_WORKERS: "0"          # builds run in the worker service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "-m", "dwg3d", "worker", "-n", "${DWG3D_WORKER_THREADS:-2}"]

  backup:
    <<: *app
    user: "0"                     # writes into a host directory
    volumes:
      - ${DWG3D_BACKUP_DIR:-./backups}:/backups
    command: ["sh", "-c", "while true; do python -m dwg3d backup /backups --keep ${DWG3D_BACKUP_KEEP:-14}; sleep ${DWG3D_BACKUP_INTERVAL:-86400}; done"]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dwg3d
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwg3d}
      POSTGRES_DB: dwg3d
    ports:
      - "127.0.0.1:${DWG3D_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwg3d -d dwg3d"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${DWG3D_S3_ACCESS_KEY:-dwg3d}
      RUSTFS_SECRET_KEY: ${DWG3D_S3_SECRET_KEY:-dwg3d-secret}
    ports:
      - "127.0.0.1:${DWG3D_S3_PORT:-9000}:9000"
    volumes:
      - s3data:/data

volumes:
  pgdata:
  s3data:
  scratch:
  caddy-data:
