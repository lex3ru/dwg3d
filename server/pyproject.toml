[project]
name = "planuchet"
version = "0.1.0"
description = "Планировка и учёт имущества здания: сервер"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pydantic-settings>=2.6",
    "shapely>=2.2.0",
    "ezdxf>=1.4.4",
    "weasyprint>=70.0",
    "python-multipart>=0.0.32",
    "openpyxl>=3.1.5",
    "segno>=1.6.6",
    "lxml>=6.1.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
