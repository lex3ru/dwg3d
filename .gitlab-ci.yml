# CI: backend tests on a real PostgreSQL and S3, frontend types / lint / build,
# container images (built on merge requests that touch them, pushed to the
# project's registry from main and tags).
#
# Tests that need the live Keycloak of docker compose, real drawings (not in
# the repository) or a DWG converter skip themselves here.

stages: [test, images]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

backend:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  services:
    - name: postgres:16-alpine
      alias: db
    - name: rustfs/rustfs:1.0.0
      alias: s3
  variables:
    POSTGRES_USER: dwg3d
    POSTGRES_PASSWORD: dwg3d
    POSTGRES_DB: dwg3d
    RUSTFS_ACCESS_KEY: dwg3d
    RUSTFS_SECRET_KEY: dwg3d-secret
    DWG3D_TEST_DATABASE_URL: postgresql+psycopg://dwg3d:dwg3d@db:5432/dwg3d
    DWG3D_TEST_S3_ENDPOINT: http://s3:9000
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    UV_LINK_MODE: copy
    MPLBACKEND: Agg
  cache:
    key:
      files: [backend/uv.lock]
    paths: [.uv-cache]
  script:
    - cd backend
    - uv sync --frozen
    - uv run pytest -q -rs --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: backend/report.xml

frontend:
  stage: test
  image: node:24-slim
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [.npm]
  script:
    - cd frontend
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
    - npm run lint
    - npm run build

.image:
  stage: images
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" "$CONTEXT"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
        tag="${CI_COMMIT_TAG:-latest}"
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$tag"
        docker push "$IMAGE:$tag"
      fi

image:api:
  extends: .image
  variables:
    CONTEXT: backend
    IMAGE: $CI_REGISTRY_IMAGE/api
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [backend/Dockerfile, backend/pyproject.toml, backend/uv.lock]

image:web:
  extends: .image
  variables:
    CONTEXT: frontend
    IMAGE: $CI_REGISTRY_IMAGE/web
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [frontend/Dockerfile, frontend/Caddyfile, frontend/package-lock.json]
