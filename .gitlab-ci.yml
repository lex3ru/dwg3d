# CI. Two parts:
#
#   the new version — the services (services/<name>), their shared chassis,
#     the UI: lint, tests on a real PostgreSQL and NATS (other services are
#     never needed), the check that requests match contracts/, images;
#   legacy/ — the current single-application version: backend tests on a real
#     PostgreSQL and S3, frontend types / lint / build, images.
#
# Images are built on merge requests that touch them and pushed to the
# project's registry from main and tags. Tests that need the live Keycloak of
# docker compose, real drawings or a DWG converter skip themselves here.

stages: [test, images]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

legacy:backend:
  stage: test
  rules: [{changes: [legacy/backend/**/*, .gitlab-ci.yml]}]
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  services:
    - name: postgres:16-alpine
      alias: db
    - name: rustfs/rustfs:1.0.0
      alias: s3
  variables:
    POSTGRES_USER: dwg3d
    POSTGRES_PASSWORD: dwg3d
    POSTGRES_DB: dwg3d
    RUSTFS_ACCESS_KEY: dwg3d
    RUSTFS_SECRET_KEY: dwg3d-secret
    DWG3D_TEST_DATABASE_URL: postgresql+psycopg://dwg3d:dwg3d@db:5432/dwg3d
    DWG3D_TEST_S3_ENDPOINT: http://s3:9000
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    UV_LINK_MODE: copy
    MPLBACKEND: Agg
  cache:
    key:
      files: [legacy/backend/uv.lock]
    paths: [.uv-cache]
  script:
    - cd legacy/backend
    - uv sync --frozen
    - uv run pytest -q -rs --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: legacy/backend/report.xml

legacy:frontend:
  stage: test
  rules: [{changes: [legacy/frontend/**/*, .gitlab-ci.yml]}]
  image: node:24-slim
  cache:
    key:
      files: [legacy/frontend/package-lock.json]
    paths: [.npm]
  script:
    - cd legacy/frontend
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
    - npm run lint
    - npm run build

.image:
  stage: images
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
    - docker build $BUILD_ARGS -t "$IMAGE:$CI_COMMIT_SHORT_SHA" "$CONTEXT"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
        tag="${CI_COMMIT_TAG:-latest}"
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$tag"
        docker push "$IMAGE:$tag"
      fi

legacy:image:api:
  extends: .image
  variables:
    CONTEXT: legacy/backend
    IMAGE: $CI_REGISTRY_IMAGE/api
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [legacy/backend/Dockerfile, legacy/backend/pyproject.toml, legacy/backend/uv.lock]

legacy:image:web:
  extends: .image
  variables:
    CONTEXT: legacy/frontend
    IMAGE: $CI_REGISTRY_IMAGE/web
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [legacy/frontend/Dockerfile, legacy/frontend/Caddyfile, legacy/frontend/package-lock.json]

# ---------------------------------------------------------- the new version ---

.service:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  services:
    - name: postgres:16-alpine
      alias: db
    - name: nats:2-alpine
      alias: nats
      command: ["-js"]
    - name: rustfs/rustfs:1.0.0
      alias: s3
  variables:
    POSTGRES_USER: twin
    POSTGRES_PASSWORD: twin
    POSTGRES_DB: postgres
    RUSTFS_ACCESS_KEY: twin
    RUSTFS_SECRET_KEY: twin-secret
    TWIN_TEST_S3_ENDPOINT: http://s3:9000
    TWIN_TEST_DATABASE_URL: postgresql+psycopg://twin:twin@db:5432/postgres
    TWIN_TEST_NATS_URL: nats://nats:4222
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    UV_LINK_MODE: copy
  cache:
    key: uv-$SERVICE
    paths: [.uv-cache]
  script:
    - cd services/$SERVICE
    - uv sync --frozen
    - uv run ruff check .
    - uv run pytest -q -rs --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: services/$SERVICE/report.xml

.service-image:
  extends: .image
  variables:
    CONTEXT: .
    IMAGE: $CI_REGISTRY_IMAGE/$SERVICE
    BUILD_ARGS: -f deploy/service.Dockerfile --build-arg SERVICE=$SERVICE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [deploy/service.Dockerfile, libs/chassis/pyproject.toml, services/*/pyproject.toml, services/*/uv.lock]

chassis:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  script:
    - uvx ruff check --config libs/chassis/pyproject.toml libs/chassis tools/new-service

# a service made from the template right now must pass the same checks
template:
  extends: .service
  variables: {SERVICE: probe}
  before_script:
    - tools/new-service probe "Проверка шаблона"

web:
  stage: test
  image: node:24-slim
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [.npm]
  script:
    - cd frontend
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
    - npm run lint
    - npm run build

image:web:
  extends: .image
  variables:
    CONTEXT: frontend
    IMAGE: $CI_REGISTRY_IMAGE/twin-web
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [frontend/Dockerfile, frontend/Caddyfile, frontend/package-lock.json]

service:gateway:
  extends: .service
  variables: {SERVICE: gateway}

image:gateway:
  extends: .service-image
  variables: {SERVICE: gateway}

service:ping:
  extends: .service
  variables: {SERVICE: ping}

image:ping:
  extends: .service-image
  variables: {SERVICE: ping}

service:import:
  extends: .service
  variables: {SERVICE: import}

image:import:
  extends: .service-image
  variables: {SERVICE: import, BUILD_ARGS: -f services/import/Dockerfile}     # its own image: with the DWG converter

service:buildings:
  extends: .service
  variables: {SERVICE: buildings}

image:buildings:
  extends: .service-image
  variables: {SERVICE: buildings}

# -- jobs of new services go above this line (tools/new-service adds them) --
