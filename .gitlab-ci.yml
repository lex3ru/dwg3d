# CI (ТЗ 8.7 п. 2): при каждом изменении — тесты сервера на настоящем PostgreSQL (в т. ч.
# проверка зависимостей между модулями, 9.2), проверка и сборка интерфейса, сценарии в
# браузере на собранной системе. legacy/ и legacy2/ — только справка (9.1), не проверяются.

include:
  - local: ci/agent-files.gitlab-ci.yml   # навыки, AGENTS.md, CLAUDE.md, файлы задач

stages: [test, e2e]

# uv одной версии во всех заданиях (R-038): образ ниже и архив в e2e. Образы uv на Debian 12
# (bookworm, как deploy/Dockerfile) выходили до 0.9.30, дальше — только на Debian 13 (ADR-0001).
# Новая версия — новый UV_RELEASE и UV_RELEASE_SHA256 (файл .sha256 рядом с архивом релиза).
variables:
  UV_RELEASE: "0.9.30"
  UV_RELEASE_SHA256: 8b3762374972daa7a74bbc6896cc73229ca69a07403dd9f9ea3805a51ffd7582

# Все задания — на docker-раннере (тег docker): задания без тегов берёт shell-раннер, где
# image и services не действуют. Образ по умолчанию — для agent-files: в Debian slim есть
# diff с -x, нужный scripts/check-agent-files.sh.
default:
  tags: [docker]
  image: ghcr.io/astral-sh/uv:$UV_RELEASE-python3.12-bookworm-slim

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.postgres: &postgres
  services:
    - name: postgres:16-alpine
      alias: db

server:
  stage: test
  image: ghcr.io/astral-sh/uv:$UV_RELEASE-python3.12-bookworm-slim
  <<: *postgres
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: app
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    UV_LINK_MODE: copy
    TEST_DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
  cache:
    key: {files: [server/uv.lock]}
    paths: [.uv-cache]
  before_script:
    # печать PDF (WeasyPrint): Pango и шрифты с кириллицей — те же пакеты, что в
    # deploy/Dockerfile (ADR-0001)
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      libharfbuzz0b libfontconfig1 fonts-dejavu-core > /dev/null
  script:
    - cd server
    - uv sync --frozen
    - uv run ruff check app migrations tests
    - uv run pytest -q -rs --junitxml=report.xml
  artifacts:
    when: always
    reports: {junit: server/report.xml}

web:
  stage: test
  image: node:24-alpine
  cache:
    key: {files: [web/package-lock.json]}
    paths: [web/node_modules]
  script:
    - cd web
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm run lint
    - npm test
    - npx vite build

e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  <<: *postgres
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: app
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    UV_LINK_MODE: copy
    APP_DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
    APP_SECURE_COOKIES: "false"
    APP_DATA_DIR: /tmp/app-data
    APP_BACKUP_DIR: /tmp/app-backups
    E2E_URL: http://localhost:8000
    E2E_TEMP_PASSWORD: Temporary-admin-1
    E2E_PASSWORD: E2e-admin-pass-1
  script:
    # uv — архив релиза UV_RELEASE с проверкой суммы, а не установщик последней версии (R-038)
    - curl -LsSf -o /tmp/uv.tar.gz
      "https://github.com/astral-sh/uv/releases/download/$UV_RELEASE/uv-x86_64-unknown-linux-gnu.tar.gz"
    - echo "$UV_RELEASE_SHA256  /tmp/uv.tar.gz" | sha256sum -c -
    - tar -xzf /tmp/uv.tar.gz -C /usr/local/bin --strip-components=1
    - (cd web && npm ci --no-audit --no-fund && npx vite build)
    - cd server && uv sync --frozen --no-dev --python 3.12
    - uv run python -m app migrate
    - uv run python -m app create-admin --password "$E2E_TEMP_PASSWORD"
    - APP_STATIC_DIR=$CI_PROJECT_DIR/web/dist uv run python -m app serve --port 8000 > server.log 2>&1 &
    - uv run python -m app worker > worker.log 2>&1 &
    - timeout 60 sh -c 'until curl -sf http://localhost:8000/api/health; do sleep 1; done'
    - cd ../e2e && npm ci --no-audit --no-fund && npx playwright test
  artifacts:
    when: on_failure
    paths: [e2e/test-results, server/server.log, server/worker.log]
